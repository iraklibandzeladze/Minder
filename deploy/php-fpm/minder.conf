; Minder PHP-FPM pool
; Install: sudo mv /etc/php/8.5/fpm/pool.d/www.conf /etc/php/8.5/fpm/pool.d/www.conf.disabled
;          sudo cp deploy/php-fpm/minder.conf /etc/php/8.5/fpm/pool.d/minder.conf
;          sudo systemctl restart php8.5-fpm && ls -la /run/php/minder.sock
[minder]
user = deploy
group = www-data
listen = /run/php/minder.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

php_admin_value[memory_limit] = 256M
php_admin_value[error_log] = /var/log/php-fpm-minder.log
php_admin_flag[log_errors] = on
