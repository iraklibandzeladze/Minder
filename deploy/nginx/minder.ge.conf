# Minder — minder.ge
# Install: sudo cp deploy/nginx/minder.ge.conf /etc/nginx/sites-available/minder.ge
#          sudo ln -s /etc/nginx/sites-available/minder.ge /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d minder.ge -d www.minder.ge
# certbot adds the 443 block and HTTP→HTTPS redirect automatically.

# www → apex
server {
    listen 80;
    listen [::]:80;
    server_name www.minder.ge;
    return 301 https://minder.ge$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name minder.ge;

    root /var/www/minder/frontend/dist;
    index index.html;
    client_max_body_size 10m;

    access_log /var/log/nginx/minder.ge.access.log;
    error_log  /var/log/nginx/minder.ge.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Laravel: API, Sanctum CSRF cookie, OAuth redirect/callback, healthcheck
    location ~ ^/(api|sanctum|auth|up)(/|$) {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/minder.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/minder/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/minder/backend/public;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # PWA: service worker / manifest must never be cached
    location ~* (sw\.js|workbox-.*\.js|manifest\.webmanifest|registerSW\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Hashed build assets — cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback (/invite/{token}, deep links)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
